<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complaint | SwiftTrack</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom Styles -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body class="bg-subtle">
    <!-- Header -->
    <nav class="form-page-header">
        <div class="sidebar-logo">
            <div class="logo-box">
                <i class="fas fa-truck-fast text-white"></i>
            </div>
            <div class="logo-text">
                <span class="logo-swift">Swift</span><span class="logo-track">Track</span>
            </div>
        </div>
        <a href="../auth/login.html" class="back-link">
            <i class="fas fa-arrow-left"></i>
            Back to Login
        </a>
    </nav>

    <!-- Main Content -->
    <main class="form-container">
        <div class="header-meta" style="margin-bottom: 32px;">
            <h1 style="font-size: 28px; font-weight: 800; color: var(--text-title);">File a Complaint</h1>
            <p>We're sorry you had a bad experience. Let us know what went wrong and we'll make it right.</p>
        </div>

        <form id="complaint-form" class="form-card animate-reveal">
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Order ID <span class="required">*</span></label>
                    <input type="text" class="form-control" placeholder="e.g. ORD-2026-00142" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Complaint Type <span class="required">*</span></label>
                    <select class="form-control" required>
                        <option value="" disabled selected>Select an option</option>
                        <option value="delayed">Delayed Delivery</option>
                        <option value="damaged">Damaged Package</option>
                        <option value="behavior">Driver Behavior</option>
                        <option value="missing">Missing Items</option>
                        <option value="other">Other</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Description <span class="required">*</span></label>
                <textarea class="form-control" rows="5" placeholder="Please describe the issue in detail. Include any relevant information such as delivery date, driver behavior, package condition, etc." required></textarea>
            </div>

            <div class="form-group">
                <label class="form-label">Attach Image (optional)</label>
                <div class="upload-area">
                    <div class="upload-icon">
                        <i class="fas fa-cloud-arrow-up"></i>
                    </div>
                    <p style="font-size: 14px; font-weight: 600; color: var(--clr-neutral-500);">Click to upload an image</p>
                    <p style="font-size: 11px; color: var(--clr-neutral-400); margin-top: 4px;">PNG, JPG, or WEBP up to 10MB</p>
                    <input type="file" style="display: none;" id="file-upload">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Contact Email <span class="required">*</span></label>
                <input type="email" class="form-control" placeholder="your.email@example.com" required>
                <p style="font-size: 11px; color: var(--clr-neutral-500); margin-top: 4px;">We'll use this email to follow up on your complaint.</p>
            </div>

            <div class="form-footer">
                <a href="feedback.html" class="form-link">Want to leave feedback instead?</a>
                <button type="submit" class="btn-submit">
                    <i class="fas fa-paper-plane"></i>
                    Submit Complaint
                </button>
            </div>
        </form>
    </main>

    <!-- Scripts -->
    <script src="js/dashboard.js"></script>
    <script>
        // Simple file upload trigger
        const uploadArea = document.querySelector('.upload-area');
        const fileInput = document.getElementById('file-upload');
        if (uploadArea && fileInput) {
            uploadArea.addEventListener('click', () => fileInput.click());
            fileInput.addEventListener('change', (e) => {
                if (e.target.files.length > 0) {
                    uploadArea.querySelector('p').textContent = e.target.files[0].name;
                }
            });
        }
    </script>
</body>
</html>
