<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback | SwiftTrack</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom Styles -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body class="bg-subtle">
    <!-- Header -->
    <nav class="form-page-header">
        <div class="sidebar-logo">
            <div class="logo-box">
                <i class="fas fa-truck-fast text-white"></i>
            </div>
            <div class="logo-text">
                <span class="logo-swift">Swift</span><span class="logo-track">Track</span>
            </div>
        </div>
        <a href="../auth/login.html" class="back-link">
            <i class="fas fa-arrow-left"></i>
            Back to Login
        </a>
    </nav>

    <!-- Main Content -->
    <main class="form-container">
        <div class="header-meta" style="margin-bottom: 32px;">
            <h1 style="font-size: 28px; font-weight: 800; color: var(--text-title);">Share Your Feedback</h1>
            <p>Help us improve our delivery experience. Your feedback matters to us.</p>
        </div>

        <form id="feedback-form" class="form-card animate-reveal">
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Full Name <span class="required">*</span></label>
                    <input type="text" class="form-control" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Email Address <span class="required">*</span></label>
                    <input type="email" class="form-control" placeholder="john@example.com" required>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Order ID <span class="required">*</span></label>
                <input type="text" class="form-control" placeholder="e.g. ORD-2026-00142" required>
            </div>

            <div class="form-group">
                <label class="form-label">Delivery Rating <span class="required">*</span></label>
                <div class="star-rating">
                    <i class="fas fa-star star-btn"></i>
                    <i class="fas fa-star star-btn"></i>
                    <i class="fas fa-star star-btn"></i>
                    <i class="fas fa-star star-btn"></i>
                    <i class="fas fa-star star-btn"></i>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Feedback Message <span class="required">*</span></label>
                <textarea class="form-control" rows="5" placeholder="Tell us about your delivery experience..." required></textarea>
            </div>

            <div class="form-footer">
                <a href="complaint.html" class="form-link">Need to file a complaint instead?</a>
                <button type="submit" class="btn-submit">
                    <i class="fas fa-paper-plane"></i>
                    Submit Feedback
                </button>
            </div>
        </form>
    </main>

    <!-- Scripts -->
    <script src="js/dashboard.js"></script>
</body>
</html>
