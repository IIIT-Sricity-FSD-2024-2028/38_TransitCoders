<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders | SwiftTrack Customer</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  
  <div class="app-container">
    
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24"><path d="M20 8h-3V4H3c-1.1 0-2 .9-2 2v11h2c0 1.66 1.34 3 3 3s3-1.34 3-3h6c0 1.66 1.34 3 3 3s3-1.34 3-3h2v-5l-3-4zM6 18.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm13.5-9l1.96 2.5H17V9.5h2.5zm-1.5 9c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
        </div>
        <div class="logo-text">Swift<span>Track</span></div>
      </div>
      <nav class="sidebar-nav">
        <ul>
          <li><a href="index.html" class="nav-item"><i class="fa-solid fa-chart-pie"></i> Dashboard</a></li>
          <li><a href="tracking.html" class="nav-item"><i class="fa-solid fa-location-crosshairs"></i> Tracking</a></li>
          <li><a href="orders.html" class="nav-item active"><i class="fa-solid fa-box-open"></i> My Orders</a></li>
          <li><a href="support.html" class="nav-item"><i class="fa-solid fa-headset"></i> Help & Support</a></li>
        </ul>
      </nav>
      <div class="sidebar-footer">
        <div class="user-profile-sm">
          <div class="user-avatar">US</div>
          <div class="user-info">
            <div class="user-name">Loading...</div>
            <div class="user-role">Customer</div>
          </div>
          <button class="icon-btn" onclick="window.logout()" title="Logout">
            <i class="fa-solid fa-arrow-right-from-bracket"></i>
          </button>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="topbar">
        <div class="topbar-title">My Orders</div>
        <div class="topbar-right">
          <div class="theme-toggle" id="theme-toggle">
            <svg id="theme-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
            <span id="theme-label">Light</span>
          </div>
          <div class="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            <input placeholder="Search tracking ID..." id="global-search"/>
          </div>
          <div class="icon-wrap" id="notif-wrap">
            <button class="icon-btn" title="Notifications"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg></button>
            <div class="notif-dot"></div>
          </div>
          <div class="icon-wrap" id="avatar-wrap" style="margin-left: 8px;">
            <div class="user-profile-btn" id="topbar-avatar"><span class="topbar-initials">JD</span><div class="user-status-dot"></div></div>
          </div>
        </div>
      </header>

      <div class="content-area">
        
        <div class="card">
          <div class="card-header">
            <div class="card-title">Order History</div>
            <div>
              <input type="text" id="search-input" class="form-control" placeholder="Search by Tracking ID..." style="width: 250px; padding: 8px 12px; border: 1.5px solid var(--border); border-radius: var(--r);">
            </div>
          </div>
          <div style="padding: 16px;">
            <div class="shipment-grid" id="orders-grid">
              <div style="text-align: center; grid-column: 1 / -1; color: var(--light); padding: 40px; font-size: 13px;">Loading data...</div>
            </div>
          </div>
        </div>

      </div>
    </main>

    <!-- Tracking Panel Overlay -->
    <div class="modal-overlay" id="tracking-overlay"></div>
    
    <!-- Tracking Centered Modal -->
    <div class="modal-centered" id="tracking-panel">
      <div class="modal-header">
        <h3 id="panel-title">Track Shipment</h3>
        <button class="icon-btn" id="close-panel-btn"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        
        <div style="margin-bottom: 24px;">
          <h2 style="font-size: 1.5rem; color: var(--orange);" id="detail-tracking-id">SWT-XXXXXX</h2>
          <p style="color: var(--mid); margin-top: 4px;">Destination: <span id="detail-destination" style="color: var(--dark); font-weight: 500;">...</span></p>
          <div style="margin-top: 12px;">
            <span class="badge" id="detail-badge">Loading</span>
          </div>
        </div>

        <div class="card" style="background-color: var(--bg); border: none; margin-bottom: 24px;">
          <h4 style="margin-bottom: 16px; font-size: 1.1rem;">Tracking Timeline</h4>
          <div class="timeline" id="tracking-timeline">
            <!-- Timeline injected via JS -->
          </div>
        </div>
        
        <div style="display: flex; gap: 12px; flex-direction: column;">
          <button class="btn btn-primary" id="btn-raise-issue" style="width: 100%;">Report an Issue</button>
        </div>

      </div>
    </div>

  </div>

  <!-- Shared Scripts -->
  <script src="../assets/js/state.js"></script>
  <script src="../js/api.js"></script>
  <script src="js/customer-api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/views/orders.js"></script>

  <style>
    @media (max-width: 768px) {
      #mobile-menu-toggle { display: flex !important; margin-right: 16px; }
      .topbar-left { display: flex; align-items: center; }
    }
  </style>
</body>
</html>
