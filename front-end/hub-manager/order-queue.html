<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Queue | Hub Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="css/hub-manager.css">

    <style>
        .hm-toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-24); }
        .hm-toolbar-title { font-size: 20px; font-weight: 700; color: var(--text-title); }
        .hm-toolbar-actions { display: flex; align-items: center; gap: var(--space-12); }
        .hm-filter-btn { display: inline-flex; align-items: center; gap: var(--space-8); background-color: var(--surface-default); border: 1px solid var(--border-default); padding: var(--space-8) var(--space-16); border-radius: var(--radius-m); font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--text-body); transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .hm-filter-btn:hover { border-color: var(--border-strong); background-color: var(--surface-subtle); }
        .hm-filter-btn svg { width: 14px; height: 14px; fill: currentColor; }
        .hm-search-field { display: flex; align-items: center; gap: 8px; background: var(--surface-subtle); border: 1px solid var(--border-default); border-radius: var(--radius-m); padding: 8px 16px; }
        .hm-search-field input { background: none; border: none; outline: none; color: var(--text-title); font-size: 13px; font-weight: 500; font-family: inherit; width: 200px; }
        .hm-search-field svg { width: 14px; height: 14px; fill: var(--text-subtitle); }
        .hm-card-meta-row { display: flex; flex-direction: column; gap: var(--space-4); font-size: 11px; color: var(--text-subtitle); margin-top: var(--space-16); padding-top: var(--space-16); border-top: 1px dashed var(--border-lighter); }
        .hm-card-eta { color: var(--text-body); font-weight: 500; }
        .hm-badge-high { background-color: var(--error-surface); color: var(--error-border); border: 1px solid var(--error-border); }
        .hm-badge-medium { background-color: var(--warning-surface); color: var(--warning-border); border: 1px solid var(--warning-border); }
        .hm-badge-low { background-color: var(--info-surface); color: var(--info-border); border: 1px solid var(--info-border); }
        .hm-phone { display: flex; align-items: center; gap: var(--space-8); margin-top: var(--space-12); font-size: 12px; font-weight: 600; color: var(--text-title); }
        .hm-phone svg { width: 14px; height: 14px; stroke: var(--brand-action); }
        .hm-pagination { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-8); margin-top: var(--space-32); color: var(--text-subtitle); font-size: 12px; }
        .hm-page-nav { display: flex; gap: var(--space-12); margin-top: 4px; }
        .hm-page-nav button { background: none; border: none; cursor: pointer; color: var(--text-subtitle); font-weight: 600; font-family: inherit; }
        .hm-page-nav button.active { color: var(--brand-action); }
        .hm-page-nav button:hover { color: var(--text-title); }
        .hm-brand-footer { margin-top: 64px; padding-top: 24px; padding-bottom: 24px; border-top: 1px solid var(--border-default); display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--text-subtitle); font-weight: 600; letter-spacing: 0.5px; }
        .hm-social { display: flex; gap: 16px; }
        .hm-social svg { width: 16px; height: 16px; fill: currentColor; opacity: 0.7; cursor: pointer; transition: 0.2s; }
        .hm-social svg:hover { opacity: 1; color: var(--brand-action); }

        /* Missing Card Layout Overrides */
        .hm-order-cards { display: flex; flex-direction: column; gap: var(--space-24); }
        .hm-order-card { background: var(--surface-default); border: 1px solid var(--border-default); border-radius: var(--radius-m); padding: var(--space-24); transition: border-color var(--hm-transition), background-color var(--hm-transition); animation: slideUp 0.4s ease-out forwards; opacity: 0; display: flex; flex-direction: column; }
        .hm-order-card:hover { border-color: var(--border-strong); }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .hm-order-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-16); flex-wrap: wrap; gap: var(--space-16); border-bottom: 1px solid var(--border-subtle); padding-bottom: 16px; }
        .hm-order-title { font-size: 16px; font-weight: 700; color: var(--brand-action); display: flex; align-items: center; gap: 12px; }
        .hm-order-actions { display: flex; gap: 12px; }
        
        .hm-order-progress { display: flex; flex-direction: column; justify-content: center; height: 32px; margin: 24px 0; }
        .hm-progress-track { height: 4px; background: var(--surface-disabled); position: relative; border-radius: 2px; width: 100%; }
        .hm-progress-fill { height: 100%; background: var(--brand-action); transition: width 1s cubic-bezier(0.4, 0, 0.2, 1); border-radius: 2px; }
        @keyframes floatTruckQueue { 0% { transform: translateY(-50%) translateX(0); } 50% { transform: translateY(-50%) translateX(3px); } 100% { transform: translateY(-50%) translateX(0); } }
        .hm-progress-truck { position: absolute; top: 50%; transform: translateY(-50%); margin-left: -12px; width: 24px; height: 24px; color: var(--text-subtitle); transition: left 1s cubic-bezier(0.4, 0, 0.2, 1); animation: floatTruckQueue 2.5s ease-in-out infinite; }
        
        .hm-order-locations { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; margin-bottom: 24px; }
        .hm-loc-box { flex: 1; font-size: 13px; color: var(--text-body); line-height: 1.5; }
        .hm-loc-box > div:first-child { display: flex; align-items: center; font-size: 11px; font-weight: 600; color: var(--text-caption); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 4px; }
        .hm-loc-box:last-child > div:first-child { justify-content: flex-end; }
        
        body.dark .hm-order-card { background: var(--surface-subtle); border-color: var(--border-default); }
        body.dark .hm-progress-track { background: var(--surface-lighter); }
    </style>
    <style>
        #page-content { max-width: 1400px; width: 100%; margin: 0 auto; padding-right: var(--space-24); }
    </style>
</head>
<body class="light" onload="initPage()">

<div class="hm-layout">
    <aside id="sidebar" class="hm-sidebar"></aside>
    <header id="navbar" class="hm-navbar"></header>

    <main class="hm-main">
        <div id="page-content">
            <div class="hm-page-header">
                <div>
                    <h1 class="hm-page-title">Orders Queue</h1>
                    <p class="hm-page-subtitle">Manage and assign delivery orders</p>
                </div>
            </div>

            <hr style="border:none; border-top:1px solid var(--border-default); margin: var(--space-32) 0;">

            <div class="hm-toolbar">
                <div class="hm-toolbar-title" style="font-size:18px; font-style: italic;">Orders Queue</div>
                <div class="hm-toolbar-actions">
                    <div class="hm-search-field">
                        <span>Search</span>
                        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                    </div>
                    <button class="hm-filter-btn">Priority Filter <svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg></button>
                    <button class="hm-filter-btn">Status Filter <svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg></button>
                    <button class="hm-filter-btn" style="background: var(--surface-subtle);">Sort <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-left:4px;"><path d="M12 5v14M19 12l-7 7-7-7M5 12l7 7 7-7"/></svg></button>
                </div>
            </div>

            <div class="hm-order-cards" id="ordersGrid"></div>

            <div class="hm-pagination" id="paginationContainer"></div>

            <div class="hm-brand-footer">
                <div>© 2026 SWIFTTRACK. ALL RIGHTS RESERVED.</div>
                <div class="hm-social">
                    <svg viewBox="0 0 24 24"><path d="M12 2C6.47 2 2 6.47 2 12c0 4.42 2.87 8.17 6.84 9.49.5.09.68-.22.68-.48v-1.92c-2.78.6-3.37-1.12-3.37-1.12-.45-1.15-1.1-1.46-1.1-1.46-.91-.62.07-.61.07-.61 1 .07 1.53 1.03 1.53 1.03.89 1.52 2.34 1.08 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.64 0 0 .84-.27 2.75 1.02.8-.22 1.65-.33 2.5-.33.85 0 1.7.11 2.5.33 1.91-1.29 2.75-1.02 2.75-1.02.55 1.37.2 2.39.1 2.64.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.68-4.57 4.93.36.31.68.92.68 1.85v2.75c0 .26.18.58.69.48A10.01 10.01 0 0022 12c0-5.53-4.47-10-10-10z"/></svg>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1112.63 8 4 4 0 0116 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 8a6 6 0 016 6v7h-4v-7a2 2 0 00-2-2 2 2 0 00-2 2v7h-4v-7a6 6 0 016-6z"></path><rect x="2" y="9" width="4" height="12"></rect><circle cx="4" cy="4" r="2"></circle></svg>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 3a10.9 10.9 0 01-3.14 1.53 4.48 4.48 0 00-7.86 3v1A10.66 10.66 0 013 4s-4 9 5 13a11.64 11.64 0 01-7 2c9 5 20 0 20-11.5a4.5 4.5 0 00-.08-.83A7.72 7.72 0 0023 3z"></path></svg>
                </div>
            </div>
        </div>
    </main>
    <div class="hm-modal-overlay" id="agentModal">
        <div class="hm-modal">
            <div class="hm-modal-header">
                <h3>Assign Agent to Order</h3>
                <button class="hm-btn-ghost" onclick="closeModal('agentModal')">X</button>
            </div>
            <div class="hm-modal-body" id="agentModalBody"></div>
        </div>
    </div>
</div>

<script src="../js/mockData.js"></script>
<script src="js/hub-manager.js"></script>
<script>
    let currentUser = null;
    let allOrders = [];
    let currentPage = 1;
    let itemsPerPage = 5;

    function initPage() {
        initTheme();
        currentUser = checkSession();
        if (!currentUser) return;
        renderSidebar('order-queue.html');
        renderNavbar('Orders Queue');
        showSkeletonBlock('ordersGrid');
        setTimeout(() => loadQueue(), 800);
    }

    function loadQueue() {
        if (!window.mockData || !window.mockData.orders) return;
        allOrders = window.mockData.orders.filter(o => o.pickup_hub_id === currentUser.hub_id);
        renderOrdersGrid();
    }

    function renderOrdersGrid() {
        const grid = document.getElementById('ordersGrid');
        if (allOrders.length === 0) {
            grid.innerHTML = '<div style="padding:48px; text-align:center; color:var(--text-subtitle);">No orders found matching criteria.</div>';
            document.getElementById('paginationContainer').innerHTML = '';
            return;
        }

        const startIndex = (currentPage - 1) * itemsPerPage;
        const pagedOrders = allOrders.slice(startIndex, startIndex + itemsPerPage);

        let htmlOut = "";
        for (let i = 0; i < pagedOrders.length; i++) {
            const order = pagedOrders[i];
            const statusBadge = getStatusBadge(order.status);
            
            let pClass = "hm-badge-low", pLabel = "LOW";
            if (order.status === 'Pending' && i % 3 === 0) { pClass = 'hm-badge-high'; pLabel = 'HIGH'; } 
            else if (order.status === 'In Transit' || order.status === 'Assigned') { pClass = 'hm-badge-medium'; pLabel = 'MEDIUM'; }
            
            const priorityBadge = "<span class='hm-badge " + pClass + "'>" + pLabel + "</span>";
            const agentName = getAgentName(order.agent_id);
            const isPending = order.status === 'Pending';
            const disableOthers = order.status === 'In Transit' || order.status === 'Delivered';
            const ph = "+91 " + Math.floor(80000 + Math.random() * 19999) + ' ' + Math.floor(10000 + Math.random() * 89999);

            let prog = 0;
            switch(order.status) {
                case 'Assigned': prog=20; break; case 'Picked Up': prog=40; break;
                case 'In Transit': prog=60; break; case 'Out for Delivery': prog=80; break; case 'Delivered': prog=100; break;
            }

            const btnA = isPending ? "<button class='hm-btn hm-btn-outline hm-btn-sm' onclick=\"openAgentModal('"+order.order_id+"')\">Assign Agent</button>" : "<button class='hm-btn hm-btn-outline hm-btn-sm' disabled>Assign Agent</button>";
            const btnT = disableOthers ? "<button class='hm-btn hm-btn-outline hm-btn-sm' disabled>Transfer Hub</button>" : "<button class='hm-btn hm-btn-outline hm-btn-sm'>Transfer Hub</button>";
            const tSvg = "<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2'><rect x='1' y='3' width='15' height='13' rx='1'/><polygon points='16 8 20 8 23 11 23 16 16 16 16 8'/><circle cx='5.5' cy='18.5' r='2.5'/><circle cx='18.5' cy='18.5' r='2.5'/></svg>";
            const eSvg = "<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2'><circle cx='12' cy='12' r='5' fill='currentColor'/></svg>";
            const tkr = prog > 0 ? "<div class='hm-progress-truck' style='left: "+prog+"%'>" + tSvg + "</div>" : "<div class='hm-progress-truck' style='left: 0%'>" + eSvg + "</div>";
            const oid = order.order_id.replace('ORD_', '');
            const pk = getHubName(order.pickup_hub_id);
            const dl = order.delivery_address;
            const rVal = (250 + Math.random() * 2000).toFixed(0);
            const rDist = (Math.random() * 10 + 1).toFixed(1);

            htmlOut += `
                <div class="hm-order-card hm-card" style="animation-delay: ${0.05 * (i % 5)}s">
                    <div class="hm-order-top">
                        <div class="hm-order-title">
                            Order #${oid} ${statusBadge} ${priorityBadge}
                        </div>
                        <div class="hm-order-actions">${btnA} ${btnT} <button class="hm-btn hm-btn-outline hm-btn-sm">View</button></div>
                    </div>
                    <div style="margin-top: var(--space-12);">
                        <div style="font-size: 14px; font-weight: 600; font-style: italic; color: var(--text-title);">Customer: ${order.customer_name}</div>
                        <div style="font-size: 13px; font-style: italic; color: var(--text-subtitle); margin-top:2px;">Assigned Agent: ${agentName}</div>
                    </div>
                    <div class="hm-order-progress">
                        <div class="hm-progress-track">
                            <div class="hm-progress-fill" style="width: ${prog}%"></div>${tkr}
                        </div>
                    </div>
                    <div class="hm-order-locations">
                        <div class="hm-loc-box">
                            <div>Pick Up Hub</div>
                            <span style="font-style:italic;">${pk}</span>
                            <div class="hm-phone">Customer Phone <br><span style="color:var(--text-subtitle); font-weight:400;">${ph}</span></div>
                        </div>
                        <div class="hm-loc-box">
                            <div>Delivery Location</div>
                            <span style="font-style:italic;">${dl}</span>
                        </div>
                    </div>
                    <div class="hm-card-meta-row" style="flex-direction:row; justify-content:space-between;">
                        <span>ETA: <span class="hm-card-eta">02:30 PM</span></span>
                        <span>Order Value: ₹${rVal}</span>
                        <span>Distance: ${rDist} km</span>
                    </div>
                </div>
            `;
        }
        grid.innerHTML = htmlOut;
        renderPagination();
    }

    function renderPagination() {
        const totalPages = Math.ceil(allOrders.length / itemsPerPage);
        if (totalPages <= 1) {
            document.getElementById('paginationContainer').innerHTML = '';
            return;
        }

        let navBtns = '';
        for (let p = 1; p <= totalPages; p++) {
            navBtns += `<button class="${p === currentPage ? 'active' : ''}" onclick="goToPage(${p})">${p}</button>`;
        }

        document.getElementById('paginationContainer').innerHTML = `
            <span>Rows per page: ${itemsPerPage}</span>
            <div class="hm-page-nav">
                <button onclick="goToPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled style="opacity:0.5"' : ''}>&lt;</button>
                ${navBtns}
                <button onclick="goToPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled style="opacity:0.5"' : ''}>&gt;</button>
            </div>
        `;
    }

    function goToPage(page) {
        const totalPages = Math.ceil(allOrders.length / itemsPerPage);
        if (page < 1 || page > totalPages) return;
        currentPage = page;
        window.scrollTo({ top: 0, behavior: 'smooth' });
        renderOrdersGrid();
    }

    function openAgentModal(orderId) { openModal('agentModal'); }
</script>
</body>
</html>
