<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | SwiftTrack Logistics</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Global Styles & Auth Specific Styles -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body>
    <div class="auth-container">
        <!-- Left Side: Branding -->
        <div class="auth-left">
            <div class="auth-overlay"></div>
            <img src="../images/340bf1d403c41cc68fac471c2e7bf5d9387d736f.jpg" alt="SwiftTrack Logistics" class="auth-left-img">
            
            <div class="auth-left-content">
                <a href="../index.html" class="auth-logo">
                    <span class="dot"></span>
                    Swift<span style="color: #ff5c02;">Track</span>
                </a>
                
                <div class="auth-promo">
                    <h2>Join the Future<br>of Logistics</h2>
                    <p>Create your account and start managing your delivery operations with cutting-edge tools.</p>
                </div>
                
                <div class="auth-social-proof">
                    <div class="avatars">
                        <div class="avatar-circle">RA</div>
                        <div class="avatar-circle">PS</div>
                        <div class="avatar-circle">VK</div>
                    </div>
                    <span class="proof-text">Trusted by 2,000+ logistics teams</span>
                </div>
            </div>
        </div>
        
        <!-- Right Side: Sign Up Form -->
        <div class="auth-right">
            <div class="auth-form-box" style="max-width: 480px;">
                <div class="auth-header">
                    <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px;">
                        <div>
                            <h1>Create account</h1>
                            <p>Get started with SwiftTrack today</p>
                        </div>
                        <div class="theme-switch" role="button" aria-label="Toggle dark mode" style="margin-top: 8px;">
                            <i class="fa-solid fa-sun icon-light"></i>
                            <i class="fa-solid fa-moon icon-dark" style="display:none;"></i>
                            <span>Light</span>
                        </div>
                    </div>
                </div>
                
                <form id="register-form">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                        <div class="form-group">
                            <label for="first-name">First Name</label>
                            <input type="text" id="first-name" class="form-input" placeholder="Vinod" required>
                        </div>
                        <div class="form-group">
                            <label for="last-name">Last Name</label>
                            <input type="text" id="last-name" class="form-input" placeholder="Reddy" required>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" class="form-input" placeholder="name@company.com" required>
                    </div>

                    <div class="form-group">
                        <label for="company">Company</label>
                        <input type="text" id="company" class="form-input" placeholder="Your logistics company">
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" class="form-input" placeholder="Enter your password" required>
                    </div>
                    
                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox" id="terms" required> I agree to the <a href="#" style="color:#ff6900;">Terms</a> and <a href="#" style="color:#ff6900;">Privacy Policy</a>
                        </label>
                    </div>
                    
                    <button type="submit" class="auth-btn">Create Account</button>
                    
                    <div class="divider">or</div>
                    
                    <button type="button" class="google-btn">
                        <img src="https://www.google.com/favicon.ico" width="20" height="20" alt="Google icon">
                        Sign up with Google
                    </button>
                    
                    <div class="auth-footer">
                        Already have an account? <a href="login.html">Sign in</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Data + Auth Module Scripts -->
    <script src="../data/mockData.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('register-form');
            if (form) {
                form.addEventListener('submit', (e) => {
                    e.preventDefault();
                    // Mock registration - just simulate success and redirect to login
                    alert('Account created successfully! Please sign in.');
                    window.location.replace('login.html');
                });
            }
        });
    </script>
</body>
</html>
